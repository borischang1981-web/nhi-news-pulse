name: Update public news and publish website
on:
  workflow_dispatch:
  schedule:
    # UTC: every 4 hours; scheduled jobs may run late due to GitHub load.
    - cron: '17 0,4,8,12,16,20 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/update-news.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nhi-news-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public RSS headlines
        run: python scripts/collect.py
      - name: Save public news snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.js data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update public news RSS snapshot"
            git push
          fi
      - name: Prepare site bundle
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/news.js data/news.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
